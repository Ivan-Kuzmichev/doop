name: Build Doop image

# Upstream (kgoedecke/doop) does not publish a Docker image, so this workflow
# watches its releases and builds one into GHCR whenever a new vX.Y.Z appears.

on:
  schedule:
    - cron: '17 */3 * * *'   # every 3 hours
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream tag to build (empty = latest release)'
        required: false
      force:
        description: 'Rebuild even if the image already exists'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: build-doop
  cancel-in-progress: false

env:
  UPSTREAM: kgoedecke/doop
  IMAGE: ghcr.io/ivan-kuzmichev/doop
  # add linux/arm64 if you need it (builds under QEMU, noticeably slower)
  PLATFORMS: linux/amd64

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve upstream release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG:-}" ]; then
            tag="$INPUT_TAG"
          else
            # newest non-draft, non-prerelease app release (skip desktop-* tags)
            tag=$(gh api "repos/$UPSTREAM/releases?per_page=30" \
              --jq '[.[] | select(.draft|not) | select(.prerelease|not)
                     | select(.tag_name|test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))][0].tag_name')
          fi
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "No upstream release found" >&2; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Upstream release: $tag"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if already built
        id: check
        env:
          VERSION: ${{ steps.rel.outputs.version }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "${FORCE:-false}" != "true" ] && docker manifest inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "$IMAGE:$VERSION already exists — nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out upstream at release tag
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ steps.rel.outputs.tag }}

      - name: Set up QEMU
        if: steps.check.outputs.skip != 'true' && contains(env.PLATFORMS, 'arm64')
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Image metadata
        if: steps.check.outputs.skip != 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # `latest` only via the raw rule below, so manual builds of old tags don't move it
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.rel.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.rel.outputs.tag }}
            type=raw,value=latest,enable=${{ inputs.tag == '' || inputs.tag == null }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ env.UPSTREAM }}
            org.opencontainers.image.version=${{ steps.rel.outputs.version }}

      - name: Build and push
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Optional analytics keys baked into the client bundle (leave unset to disable)
          build-args: |
            VITE_POSTHOG_KEY=${{ vars.VITE_POSTHOG_KEY }}

      - name: Summary
        if: steps.check.outputs.skip != 'true'
        run: |
          {
            echo "### Built Doop ${{ steps.rel.outputs.tag }}"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
